name: Build Android Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      upload_to_rustore:
        description: 'Загрузить AAB в RuStore'
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # 1. Декодируем keystore
      - name: Decode keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > release-key.jks

      # 2. Прокидываем переменные в среду
      - name: Export signing env
        run: |
          echo "MYAPP_KEYSTORE=$PWD/release-key.jks" >> $GITHUB_ENV
          echo "MYAPP_KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> $GITHUB_ENV
          echo "MYAPP_KEY_ALIAS=${{ secrets.KEYSTORE_KEY_ALIAS }}" >> $GITHUB_ENV

      # 3. Тесты (JVM, без устройства)
      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      # 4. Сборка релизного bundle
      - name: Build Release
        run: ./gradlew bundleRelease --stacktrace

      # 5. Загружаем артефакт
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release.aab
          path: app/build/outputs/bundle/release/app-release.aab

      - name: Upload to RuStore
        if: ${{ inputs.upload_to_rustore == true }}
        run: |
          chmod +x ./rustore-deploy.sh
          ./rustore-deploy.sh
        env:
          RS_KEY_ID: ${{ secrets.RS_KEY_ID }}
          RS_PRIVATE_KEY: ${{ secrets.RS_PRIVATE_KEY }}